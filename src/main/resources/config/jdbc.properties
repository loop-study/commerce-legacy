# ============================================================
#  DB connection (MySQL 5.7 - matches the era of the original system)
#
#  The DB runs as a separate container - see docker-compose.yml
#  Port 3307 is used on the host to avoid clashing with a local MySQL.
#
#  To point at another server without editing this file:
#    mvn tomcat7:run-war -Djdbc.url=jdbc:mysql://host:3306/commerce?...
# ============================================================
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3307/commerce?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
jdbc.username=root
jdbc.password=commerce

# Connection pool.
# maxActive=8 is the commons-dbcp 1.x default, kept as-is.
# This is the number that made the PG latency experiment visible:
# once 8 order threads were stuck waiting on the PG call,
# unrelated product pages stalled too.
jdbc.initialSize=2
jdbc.maxActive=8
