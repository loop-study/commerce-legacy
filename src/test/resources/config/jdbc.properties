# ============================================================
#  테스트 DB 접속 정보
#
#  운영 설정(src/main/resources/config/jdbc.properties)을 고치지 않고
#  이 사본으로 덮어쓴다. target/test-classes 가 target/classes 보다
#  클래스패스 앞에 오기 때문에 테스트에서는 이 파일이 이긴다.
#
#  같은 컨테이너(docker compose up -d)의 다른 스키마를 쓴다.
#  commerce_test 는 없으면 접속할 때 만들어진다.
#  테이블은 test-context-datasource.xml 이 매번 새로 만든다.
# ============================================================
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3307/commerce_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
jdbc.username=root
jdbc.password=commerce

# 운영은 maxActive=8 (commons-dbcp 1.x 기본값)이다.
# 동시성 테스트는 스레드 20개를 동시에 던지는데, 풀이 8이면
# 커넥션 대기가 스레드를 줄 세워 경합 자체가 재현되지 않는다.
# 여기서 늘리는 것은 "풀 크기가 문제였다"는 뜻이 아니라
# 재고 경합만 남기고 다른 변수를 빼기 위한 것이다.
jdbc.initialSize=2
jdbc.maxActive=30
