# ============================================================
#  테스트용 메시지 사본
#
#  운영본(src/main/resources/messages/message-common.properties)의 전체 사본이고
#  pg.api.* 두 줄만 스텁 서버(WireMock)를 가리키게 바꿨다.
#
#  왜 사본이 필요한가
#    PG URL 은 MessageSource 를 거쳐 읽는다(CmmnMessage). 시스템 프로퍼티가
#    아니므로 -D 로 덮을 수 없고, PgApiUtil 을 건드리지 않고 연동을 끊으려면
#    이 파일을 클래스패스 앞쪽에 두는 방법밖에 없다.
#    target/test-classes 가 target/classes 보다 앞이라 테스트에서는 이쪽이 이긴다.
#
#  ※ 일부만 적으면 나머지 키가 사라진다. ReloadableResourceBundleMessageSource 는
#    같은 basename 을 병합하지 않고 먼저 찾은 파일 하나만 쓴다. 그래서 전체 사본이다.
#  ※ 운영본에 키를 추가하면 이 파일에도 넣어야 한다.
# ============================================================

# Common messages / config values
# Loaded by ReloadableResourceBundleMessageSource (context-common.xml)

# Bank transfer info
pay.bank.nm=상상은행
pay.bank.account=123-456789-01-234
pay.bank.holder=(주)커머스
pay.bank.limit.day=3

# Card payment PG integration (external API)
# 운영은 timeout=0(무제한)이다. 그것이 재현하려는 부채 자체다.
# 다만 테스트에서까지 무제한으로 두면 스텁이 응답하지 않을 때 빌드가 영영 멈춘다.
# 지연을 다루는 테스트는 이 값을 각자 필요한 대로 정하고,
# 기본값은 빌드가 멈추지 않을 만큼만 준다.
pg.api.url=http://localhost:18080/mock/pg/approve.do
pg.api.cancel.url=http://localhost:18080/mock/pg/cancel.do
pg.api.timeout=3000

# Mock PG server behavior (for failure simulation)
#   pg.mock.delay   : response delay in ms
#   pg.mock.fail.yn : Y = return approval rejected
pg.mock.delay=0
pg.mock.fail.yn=N
#   pg.mock.cancel.fail.yn : Y = cancel request fails (approval stays)
pg.mock.cancel.fail.yn=N
