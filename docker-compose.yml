# ============================================================
#  개발 DB (MySQL)
#
#  앱은 IntelliJ/Maven 으로 호스트에서 돌고, DB 만 컨테이너로 분리한다.
#  H2 인메모리를 쓰던 시절에는 DB 가 WAS 프로세스 안에 있어서
#  "계층"이라고 부를 것이 없었다. 분리하고 나면 경계가 실물이 된다.
#    - 커넥션 풀이 실제 소켓을 쓴다
#    - DB 만 내려서 장애 전파를 직접 관찰할 수 있다
#    - 앱을 재기동해도 데이터가 남는다
#
#  ※ 엄밀히는 같은 머신의 다른 프로세스다. 실제 2-tier 가 아니라
#    토폴로지를 로컬에서 흉내 낸 것이다.
#
#  실행:  docker compose up -d
#  폐기:  docker compose down -v      (데이터까지 삭제)
# ============================================================
services:
  db:
    # 당시 세대에 맞춰 5.7 을 쓴다.
    # 최신 버전으로 올리는 것은 그 자체로 개선이라 레거시 재현에 섞지 않는다.
    image: mysql:5.7
    container_name: commerce-db
    ports:
      # 호스트에 MySQL 이 이미 떠 있어도 충돌하지 않도록 3307 로 노출한다
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: commerce
      MYSQL_DATABASE: commerce
      TZ: Asia/Seoul
    volumes:
      # 문자셋 설정. 초기화 스크립트가 latin1 클라이언트로 실행돼
      # 한글이 이중 인코딩되는 것을 막는다 (파일 주석 참고)
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      # 컨테이너를 "처음 만들 때" 한 번만 실행된다.
      # 이미 만들어진 컨테이너를 재시작할 때는 실행되지 않으므로
      # 주문·장바구니 데이터가 쌓이는 것을 그대로 볼 수 있다.
      # 초기 상태로 되돌리려면 docker compose down -v 후 다시 up.
      #
      # 초기화 스크립트는 알파벳 순으로 실행된다. 원본 파일명이
      # data.sql / schema.sql 이라 그대로 두면 data 가 먼저 돌아 실패한다.
      # 파일명은 건드리지 않고 마운트 지점에서 순서를 강제한다.
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - commerce-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  commerce-db-data:
