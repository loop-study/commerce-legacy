# ============================================================
#  측정 전용 MySQL
#
#  앱 개발 DB(../docker-compose.yml)와 **별도 컨테이너**다.
#  아래 설정이 측정용 인위 조건이라 앱 개발에 그대로 쓰면 안 되기 때문이다.
#
#  ★ 엔진 버전을 바꿔가며 잰다
#    5.7 = 당시 세대. 인덱스 없는 조인을 Block Nested Loop 로 처리한다
#    8.0 = 지금 세대. hash join 이 있다
#    같은 SQL 이 세대에 따라 얼마나 달라지는지 보려고 둘 다 잰다.
#
#  스키마는 앱과 공유한다. run.sh 가 ../src/main/resources/db/schema.sql
#  을 그대로 적재하므로 사본을 따로 관리하지 않는다.
# ============================================================
services:
  mysql:
    image: mysql:${BENCH_MYSQL_VERSION:-5.7}
    container_name: commerce-bench-mysql
    ports:
      # 앱 개발 DB 가 3307 을 쓰므로 3308 로 띄운다.
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_DATABASE: commerce_bench
      TZ: Asia/Seoul
    command:
      # ── 버퍼풀을 일부러 작게 잡는다 ────────────────────────────────
      # 기본값이면 데이터가 전부 램에 올라가서 디스크를 안 읽는다.
      # 그러면 조회가 느려지는 이유("디스크를 긁는다")가 통째로 빠진다.
      #
      # ※ 이것이 앱 개발 DB 와 컨테이너를 나누는 이유다.
      #   개발하면서 쓰기에는 부적절한 값이다.
      - --innodb-buffer-pool-size=32M
      - --innodb-buffer-pool-instances=1
      # ── 데이터 적재 속도용 (측정은 읽기 전용이라 결과에 영향 없음) ──
      - --innodb-flush-log-at-trx-commit=2
      # ── 한글 처리 ──────────────────────────────────────────────
      # [client] 까지 지정해야 초기화·적재 시점부터 올바르게 들어간다
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
